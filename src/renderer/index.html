<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The renderer never talks to the network itself (yt-dlp runs in main),
         so only thumbnails and the Google Fonts stylesheet are allowed. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Videos Downloader</title>
    <link rel="stylesheet" href="styles/app.css">
</head>
<body>
    <div class="titlebar">
        <div class="win-controls">
            <button id="winMinimize" class="win-btn" title="Minimize">&#8211;</button>
            <button id="winMaximize" class="win-btn" title="Maximize">&#9633;</button>
            <button id="winClose" class="win-btn win-close" title="Close">&#10005;</button>
        </div>
    </div>

    <header>
        <div class="logo">Videos <span>Downloader</span></div>
        <form id="linkForm" class="link-box">
            <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
            <input id="linkInput" type="text" placeholder="Paste a YouTube playlist or video link…" autocomplete="off" spellcheck="false">
            <button type="button" id="pasteBtn" class="ghost-btn" title="Paste from clipboard">Paste</button>
            <button type="submit" id="loadBtn" class="accent-btn">Load</button>
        </form>
        <div class="header-right">
            <span id="toolBadge" class="tool-badge" title=""></span>
        </div>
    </header>

    <main>
        <section class="options card">
            <div class="opt">
                <span class="opt-label">Format</span>
                <div class="seg" id="modeSeg">
                    <button data-value="video">Video · MP4</button>
                    <button data-value="audio">Audio · MP3</button>
                </div>
            </div>
            <div class="opt" id="qualityOpt">
                <span class="opt-label">Max quality</span>
                <div class="seg" id="qualitySeg">
                    <button data-value="best">Best</button>
                    <button data-value="2160">4K</button>
                    <button data-value="1080">1080p</button>
                    <button data-value="720">720p</button>
                    <button data-value="480">480p</button>
                </div>
            </div>
            <div class="opt">
                <span class="opt-label">Cookies from</span>
                <select id="browserSelect" class="pill-select" title="Use your browser's login for age-restricted or private videos">
                    <option value="none">None</option>
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="opera">Opera</option>
                </select>
            </div>
            <div class="opt opt-wide">
                <span class="opt-label">Save to</span>
                <div class="folder-row">
                    <button id="folderBtn" class="folder-path" title="Choose folder"></button>
                    <button id="openFolderBtn" class="ghost-btn small">Open</button>
                </div>
            </div>
            <div class="opt opt-wide toggles">
                <label class="toggle"><input type="checkbox" id="subfolderChk"><span></span>Own folder per playlist</label>
                <label class="toggle"><input type="checkbox" id="numberChk"><span></span>Number files in playlist order</label>
            </div>
        </section>

        <section id="emptyState" class="empty">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            </div>
            <h2>Paste a link to get started</h2>
            <p>Playlists show every video so you can pick what to download. Single videos work too.</p>
        </section>

        <section id="loadingState" class="empty hidden">
            <div class="spinner"></div>
            <h2>Reading playlist…</h2>
            <p>Big playlists can take a few seconds.</p>
        </section>

        <section id="errorState" class="empty hidden">
            <h2>Couldn't load that link</h2>
            <p id="errorText"></p>
        </section>

        <section id="playlist" class="hidden">
            <div class="playlist-head">
                <div>
                    <h1 id="plTitle" class="section-title"></h1>
                    <p id="plMeta" class="meta"></p>
                </div>
                <div class="playlist-actions">
                    <label class="toggle"><input type="checkbox" id="selectAll" checked><span></span>Select all</label>
                    <button id="cancelBtn" class="outline-btn hidden">Cancel</button>
                    <button id="downloadBtn" class="accent-btn">Download</button>
                </div>
            </div>

            <div id="overall" class="overall card hidden">
                <div class="overall-top">
                    <span id="overallText"></span>
                    <button id="overallOpen" class="ghost-btn small hidden">Open folder</button>
                </div>
                <div class="bar"><div id="overallFill" class="bar-fill"></div></div>
            </div>

            <ol id="items" class="items"></ol>
        </section>
    </main>

    <script src="renderer.js"></script>
</body>
</html>
